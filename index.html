<style>
:root{--ink:#17324d;--sign:#f2b21c;--bg:#fff;--tile:#f1f4f7;--line:#dde4ea;--mute:#5d7084}
*{box-sizing:border-box;margin:0}
body{font-family:Tahoma,"Noto Naskh Arabic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
.bar{background:#fff;padding:8px 0 4px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.backbtn{border:0;background:var(--tile);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;flex:none}
.backbtn[hidden]{display:none}
.logo{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;direction:ltr}
.logo .mark{width:38px;height:38px;flex:none}
.logo .en{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;letter-spacing:.3px;color:#111}
.search{display:flex}
.search input{flex:1;min-width:0;padding:3px 10px;height:34px;border:1.5px solid var(--ink);border-left:0;border-radius:0 8px 8px 0;font:inherit;font-size:13px}
.search button{background:var(--ink);color:#fff;border:0;padding:0 14px;height:34px;border-radius:8px 0 0 8px;font:inherit;font-size:13px;cursor:pointer}
.tabs{display:flex;margin-top:6px;border-bottom:1px solid var(--line)}
.tabs[hidden],.search[hidden]{display:none}
.tabs button{flex:1;padding:7px 0 5px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;border-radius:0;font:inherit;font-size:15px;color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:bold}
h1{font-size:24px;margin:20px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{text-decoration:none;color:inherit;display:block}
.tile .img{background:var(--tile);border-radius:22px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.tile .img svg{width:60%}
.tile .img.full{overflow:hidden}
.tile .img.full svg,.tile .img.full img{width:100%;height:100%;display:block;object-fit:cover}
#app.anim{animation:openIn .3s ease-out;transform-origin:50% 35%}
@keyframes openIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
#app.slide-next{animation:slideNext .28s ease-out}
#app.slide-prev{animation:slidePrev .28s ease-out}
@keyframes slideNext{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes slidePrev{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.sec2{font-size:19px;font-weight:bold;margin:30px 0 2px}
.sec2:first-of-type{margin-top:18px}
.sub{font-size:13px;color:var(--mute);margin-bottom:10px}
.field{margin:16px 0}
.field>label,.lbl{display:block;font-size:14px;color:var(--ink);margin-bottom:6px}
.fi{width:100%;height:46px;padding:0 12px;border:1px solid #9aa7b4;border-radius:8px;font:inherit;font-size:15px;color:var(--ink);background:#fff}
textarea.fi{height:auto;min-height:92px;padding:10px 12px;resize:vertical}
.fi:focus{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #9aa7b4;border-radius:8px;overflow:hidden}
.seg button{padding:11px 0;border:0;border-left:1px solid #9aa7b4;background:#fff;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.seg button:last-child{border-left:0}
.seg button.on{background:var(--ink);color:#fff}
.chips.sel button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:normal}
.fixed{height:46px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--tile);font-size:15px}
.pbig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border:2px dashed #9aa7b4;border-radius:12px;color:var(--ink);cursor:pointer;text-align:center;padding:14px}
.pbig svg{width:38px;height:38px}
.pbig b{font-size:16px}
.pbig span{font-size:13px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--tile)}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc .rm{position:absolute;top:4px;left:4px;border:0;background:rgba(0,0,0,.6);color:#fff;width:28px;height:28px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer}
.pc .mn{position:absolute;bottom:4px;right:4px;background:rgba(23,50,77,.85);color:#fff;font-size:11px;line-height:1.6;padding:0 7px;border-radius:10px}
.pc .chk{position:absolute;inset:0;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink)}
.padd{aspect-ratio:1;border:2px dashed #9aa7b4;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;font-size:13px;text-align:center}
.padd b{font-size:26px;line-height:1;font-weight:normal}
.lnk{display:inline-block;margin-top:8px;font-size:14px;color:var(--ink);text-decoration:underline;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.err{background:#fdecec;color:#a12a2a;border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}
.err[hidden]{display:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:16px 0 4px}
.check input{margin-top:5px;width:20px;height:20px;flex:none}
.sbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0;margin-top:22px;z-index:5}
.call.btn{border:0;width:100%;font-family:inherit;cursor:pointer}
.call.btn[disabled]{opacity:.6}
.myad{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.myad span{color:var(--mute);font-size:13px}
.myad .del{margin-right:auto;border:0;background:none;color:#a12a2a;font:inherit;font-size:13px;cursor:pointer}
.mad{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.mad img{width:84px;height:72px;object-fit:cover;border-radius:10px;flex:none;background:var(--tile)}
.mad .t{font-weight:bold;font-size:15px}
.mad .s{font-size:13px;color:var(--mute)}
.macts{display:flex;gap:16px;margin-top:6px}
.macts button{border:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:2px 0;cursor:pointer;text-decoration:underline}
.macts .red{color:#a12a2a}
.menubtn{border:0;background:none;width:34px;height:34px;padding:6px;color:var(--ink);cursor:pointer;flex:none}
.menubtn svg{width:100%;height:100%;display:block}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.drawer-bg[hidden]{display:none}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(55vw,300px);min-width:230px;background:#fff;z-index:40;padding:14px 22px;box-shadow:-4px 0 18px rgba(0,0,0,.18);overflow:auto;transform:translateX(100%);visibility:hidden;transition:transform .28s ease,visibility .28s}
.drawer.open{transform:none;visibility:visible}
.dx{border:0;background:none;color:var(--ink);font-size:30px;line-height:1;padding:0;cursor:pointer;margin-bottom:10px}
.dh{font-size:18px;font-weight:bold;margin:14px 0 4px}
.di{display:block;width:100%;text-align:right;text-decoration:none;border:0;background:none;font:inherit;font-size:16px;padding:10px 0;color:var(--ink);cursor:pointer}
.dline{border:0;border-top:1px solid var(--line);margin:14px 0}
@media (prefers-reduced-motion:reduce){#app.anim,#app.slide-next,#app.slide-prev{animation:none}.drawer{transition:none}}
.tile span{display:block;margin-top:6px;font-size:16px}
.cards{display:grid;grid-template-columns:1fr;gap:24px;margin-top:16px}
.card{text-decoration:none;color:inherit;display:flex;gap:12px;padding:0}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column}
.card img{width:128px;height:118px;flex:none;object-fit:cover;border-radius:12px;background:var(--tile);display:block}
.card .t{font-weight:bold;font-size:15px;line-height:1.5}
.card .a{color:var(--mute);font-size:14px}
.card .p{font-size:16px;font-weight:bold;margin-top:auto;padding-top:6px}
.tag{display:inline;font-size:inherit;color:var(--mute);font-weight:normal;margin-left:6px}
.tag::after{content:" ·"}
.views{position:absolute;bottom:6px;right:6px;background:rgba(23,50,77,.8);color:#fff;font-size:11px;line-height:1.7;padding:0 8px;border-radius:10px;display:flex;align-items:center;gap:4px}
.views svg,.ago svg{width:13px;height:13px;vertical-align:-2px}
.main-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--tile);display:block;margin-top:8px}
.thumbs{display:flex;gap:8px;margin:8px 0;overflow-x:auto}
.thumbs img{width:68px;height:52px;object-fit:cover;border-radius:8px;border:3px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--sign)}
.price{font-size:22px;font-weight:bold;margin:10px 0 2px}
.addr{color:var(--mute);margin-bottom:12px}
table{width:100%;border-collapse:collapse;margin:8px 0 14px}
td{padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
td:first-child{color:var(--mute);width:38%}
.call{display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;padding:13px;border-radius:10px;font-size:17px}
.note{background:var(--tile);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.meta{color:var(--mute);font-size:14px;margin:-8px 0 4px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.ph{position:relative;flex:none}
.ph .cnt{position:absolute;bottom:6px;right:6px;background:rgba(23,50,77,.85);color:#fff;font-size:11px;line-height:1.6;padding:0 7px;border-radius:10px}
.ph .new{position:absolute;top:6px;right:6px;background:var(--sign);color:var(--ink);font-size:11px;font-weight:bold;line-height:1.6;padding:0 7px;border-radius:10px}
.heart{border:0;background:#fff;color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.heart.on,.share.on{color:#d6336c}
.ph .heart{position:absolute;top:6px;left:6px}
.favbtn{margin-right:0;border:0;background:var(--tile);color:var(--ink);border-radius:16px;height:32px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer}
.ago{color:var(--mute);font-size:13px;font-weight:normal;margin-right:8px}
.actions{display:flex;gap:8px;margin-top:8px}
.actions .call{flex:1;padding:10px 0;font-size:14px;border:0;font-family:inherit;cursor:pointer}
.wa{background:#1f9d55}
.share{background:var(--tile);color:var(--ink)}
.fab{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:0;border-radius:24px;padding:10px 22px;font:inherit;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer;z-index:20}
.fab[hidden],.sheet[hidden],#lb[hidden]{display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end}
.sheet .box{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px;max-height:85vh;overflow:auto}
.sheet h3{font-size:16px;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:4px 14px;border:1.5px solid var(--line);background:#fff;border-radius:20px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}

async function getSess(create){
  const now = Math.floor(Date.now()/1000);
  if(sess && sess.exp - 60 > now) return sess;
  if(sess && sess.rt){
    try{ const d = await raw('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:{refresh_token:sess.rt}}); saveSess(mkSess(d, sess.admin, sess.acct, sess.mail)); return sess; }
    catch(e){ if(e.status === 0) throw e; saveSess(null); }
  }
  if(create === false) return null;
  const d = await raw('/auth/v1/signup', {method:'POST', body:{data:{}}});
  saveSess(mkSess(d, false)); return sess;
}
async function rpc(name, args){ const s = await getSess(); return raw('/rest/v1/rpc/' + name, {method:'POST', body:args || {}, token:s.at}); }

    const rows = await raw('/rest/v1/ads?select=' + COLS + '&or=' + encodeURIComponent('(and(status.eq.approved,expires_at.gt.' + new Date().toISOString() + '),and(status.eq.rented,rented_at.gt.' + new Date(Date.now() - 12*3600000).toISOString() + '))') + '&order=created_at.desc&limit=300', {token:s && s.at});

let sortBy='new', fRooms=0, fArea='';
const SORTS=[['new','تازه‌ترین'],['old','قدیمی‌ترین']];
const ROOMS=[[0,'همه'],[1,'۱ اتاق'],[2,'۲ اتاق'],[3,'۳ اتاق'],[4,'۴ اتاق یا بیشتر']];
const SEED = Math.floor(Math.random()*1e9);
const hsh = id => { let x = SEED; for(const c of String(id)) x = (x*31 + c.charCodeAt(0)) >>> 0; return x; };
function applyFilters(r){
  if(fRooms) r = r.filter(h => fRooms>=4 ? h.rooms>=4 : h.rooms===fRooms);
  if(fArea) r = r.filter(h => h.area===fArea);
  r = r.slice();
  const rk = h => h.status === 'rented' ? 1 : 0;
  if(sortBy==='old') r.sort((a,b)=>rk(a)-rk(b) || b.days-a.days);
  else r.sort((a,b)=>rk(a)-rk(b) || a.days-b.days || hsh(a.id)-hsh(b.id));
  return r;
}

function norm(s){
  return String(s).replace(/[يى]/g,'ی').replace(/ك/g,'ک')
   .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
   .replace(/[آأإ]/g,'ا').replace(/[‌‏ً-ٟ]/g,' ')
   .replace(/[.,،؛؟?!:\-_()]/g,' ').replace(/(\d+)\s*(اتاق)/g,'$1 $2').toLowerCase().replace(/\s+/g,' ').trim();
}
const TYPE_WORDS = {
  'کرایی':['کرایی','کرایه','کرا','اجاره','اجاره‌ای','اجارهای'],
  'گروی':['گروی','گرو','رهن','رهنی'],
  'فروشی':['فروشی','فروش','بفروش','خرید','خریدن']
};
const ROOM_WORDS = {'یک':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6};
const STOP = new Set(('خانه خونه منزل ملک در با از به برای و که را ای می خواهم میخواهم میخوام خوام دارم هست بدون لطفا طبقه اتاق اتاقه حدود یک خانه‌ی').split(' ').map(norm));
const SYN = {'حیاط':'حویلی','پارکنگ':'پارکینگ','اپارتمان':'اپارتمان'};

function parseQuery(q){
  const toks = norm(q).split(' ').filter(Boolean);
  let type = '', rooms = null; const words = [];
  for(let i=0;i<toks.length;i++){
    const t = toks[i], next = toks[i+1]||'';
    const found = Object.keys(TYPE_WORDS).find(k=>TYPE_WORDS[k].map(norm).includes(t));
    if(found){ type = found; continue; }
    const num = /^\d+$/.test(t) ? +t : ROOM_WORDS[t];
    if(num && next.startsWith('اتاق')){ rooms = num; i++; continue; }
    if((t==='اتاق'||t==='اتاقه') && /^\d+$/.test(next)){ rooms = +next; i++; continue; }
    if(STOP.has(t)) continue;
    words.push(SYN[t]||t);
  }
  return {type, rooms, words};
}
function hay(h){ return norm([h.title,h.type,h.area,h.address,h.floor,h.water,h.note,h.price,h.rooms+' اتاق'].join(' ')); }
function search(cat, q){
  const p = parseQuery(q);
  let base = houses.filter(h=>h.cat===cat && (!p.type || h.type===p.type));
  if(p.rooms) base = base.filter(h=>h.rooms===p.rooms);
  let exact = base.filter(h=>{const t=hay(h); return p.words.every(w=>t.includes(w));});
  let near = false;
  if(!exact.length && p.words.length){
    exact = base.filter(h=>{const t=hay(h); return p.words.some(w=>t.includes(w));});
    near = exact.length>0;
  }
  return {list:exact, near, type:p.type};
}
function list(cat){
  let r, note='';
  if(query){
    const s = search(cat, query); r = s.list;
    if(s.near) note = '<div class="note">نتیجه دقیق نبود. این‌ها نزدیک‌ترین‌ها هستند.</div>';
  } else r = houses.filter(h=>h.cat===cat && (!tab || h.type===tab));
  r = applyFilters(r);
  const title = query ? `نتیجه «${esc(query)}»` : (tab||'خانه‌ها');
  return `${query?`<h1>${title}</h1>`:''}<div class="toolbar"><button type="button" id="sortBtn">⇅ مرتب‌سازی</button><button type="button" id="filtBtn">فیلتر${(fRooms||fArea)?' ●':''}</button><span class="tcount">${fa(r.length)} خانه</span></div>${note}${cards(r)}`;
}

async function shareHouse(id){
  const h = houses.find(x=>x.id==id); if(!h) return;
  const text = `${h.type}: ${h.title}\n${h.address}\n${h.price}`;
  const data = {title:h.title, text};
  if(/^https?:/.test(location.href)) data.url = location.href;
  try{ if(navigator.share){ await navigator.share(data); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('متن آگهی کپی شد'); }
  catch(e){ toast('اشتراک‌گذاری در این برنامه ممکن نیست'); }
}

function drawPhotos(){
  const w = $('pwrap'); if(!w) return;
  if(!postPhotos.length){
    w.innerHTML = `<label class="pbig" for="fFiles">${CAM}<b>افزودن عکس</b><span>از گالری گوشی انتخاب کن</span></label>`;
    return;
  }
  w.innerHTML = '<div class="pgrid">' + postPhotos.map((p,i)=>`<div class="pc"><img src="${p.url}" alt="عکس ${fa(i+1)}">${i===0?'<span class="mn">عکس اصلی</span>':''}${p.state==='checking'?'<div class="chk">در حال بررسی...</div>':''}<button type="button" class="rm" data-rm="${i}" aria-label="حذف عکس">×</button></div>`).join('')
   + (postPhotos.length < MAX_PHOTOS ? `<label class="padd" for="fFiles"><b>+</b>عکس دیگر</label>` : '') + '</div>';
}
function loadImg(file){
  return new Promise((res,rej)=>{
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(()=>URL.revokeObjectURL(u), 3000); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('این فایل عکس سالم نیست.')); };
    im.src = u;
  });
}
// عکس بزرگ را کوچک می‌کند تا فضای کمتری بگیرد
function shrink(im){
  let w = im.naturalWidth, h = im.naturalHeight, max = 1024, q = 0.72, c, out;
  for(let i=0;i<5;i++){
    const sc = Math.min(1, max/Math.max(w,h));
    c = document.createElement('canvas'); c.width = Math.round(w*sc); c.height = Math.round(h*sc);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(im,0,0,c.width,c.height);
    out = c.toDataURL('image/jpeg', q);
    if(out.length*0.75 <= TARGET_KB*1024) break;
    max = Math.round(max*0.85); q = Math.max(0.5, q-0.06);
  }
  return {canvas:c, url:out, bytes:Math.round(out.length*0.75)};
}
// ---- بررسی «فقط عکس خانه» با هوش مصنوعی (MobileNet) ----
let aiP = null, aiModel = null, aiFailed = false;
function loadScript(src){ return new Promise((res,rej)=>{ const t=document.createElement('script'); t.src=src; t.onload=res; t.onerror=()=>rej(new Error('load')); document.head.appendChild(t); }); }
function startAi(){
  if(!AI_CHECK || aiP) return;
  aiP = (async()=>{
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
    aiModel = await mobilenet.load({version:1, alpha:0.25});
  })().catch(()=>{ aiFailed = true; });
}
async function aiCheck(canvas){
  if(!AI_CHECK) return null;
  startAi();
  if(!aiModel && !aiFailed) await Promise.race([aiP, new Promise(r=>setTimeout(r, 20000))]);
  if(!aiModel) return null;      // هوش مصنوعی بالا نیامد؛ آگهی به بررسی خودمان می‌ماند
  try{
    const preds = await aiModel.classify(canvas, 3);
    const bad = preds.find(p => p.probability >= 0.4 && BLOCK.test(p.className.toLowerCase()));
    return bad ? bad.className : null;
  }catch(e){ return null; }
}
// عکس بلافاصله در لیست می‌آید؛ بررسی هوش مصنوعی پشت صحنه انجام می‌شود
function verify(r){
  aiCheck(r.canvas).then(bad => {
    r.canvas = null;
    if(bad){
      postPhotos = postPhotos.filter(x => x !== r);
      $('photoMsg') && ($('photoMsg').textContent = 'یک عکس حذف شد: به نظر عکس خانه نیست. فقط عکس خود خانه قبول می‌شود، نه موتر، موبایل یا چیز دیگر.');
    } else r.state = 'ok';
    drawPhotos();
  });
}
async function handleFiles(files){
  const msgs = [];
  for(const f of files){
    if(postPhotos.length >= MAX_PHOTOS){ msgs.push('حداکثر ' + fa(MAX_PHOTOS) + ' عکس می‌شود.'); break; }
    if(!/^image\//.test(f.type) || /gif|svg|heic|heif/.test(f.type)){ msgs.push('«' + f.name + '» قبول نیست. عکس jpg یا png بگذار.'); continue; }
    if(f.size > 25*1024*1024){ msgs.push('«' + f.name + '» خیلی بزرگ است.'); continue; }
    $('photoMsg').textContent = 'در حال آماده‌سازی عکس...';
    try{
      const im = await loadImg(f);
      if(Math.min(im.naturalWidth, im.naturalHeight) < 300) throw new Error('عکس خیلی کوچک است. عکس واضح‌تر بگیر.');
      const r = shrink(im);
      if(r.bytes > 280*1024) throw new Error('این عکس خیلی سنگین است. عکس دیگری انتخاب کن.');
      const item = {url:r.url, before:f.size, bytes:r.bytes, canvas:r.canvas, state:'checking'};
      postPhotos.push(item); drawPhotos(); verify(item);
      if(f.size > r.bytes*1.5) msgs.push('عکس کوچک شد: از ' + kbText(f.size) + ' به ' + kbText(r.bytes) + '.');
    }catch(e){ msgs.push(e.message || 'عکس باز نشد.'); }
  }
  $('photoMsg').textContent = msgs.join(' ');
}
function showErr(m){ const e = $('formErr'); e.textContent = m; e.hidden = !m; }
async function submitAd(){
  showErr('');
  const v = id => $(id).value.trim();
  if($('fHp').value) return;                                   // ربات‌ها این خانه پنهان را پر می‌کنند
  if(!postPhotos.length) return showErr('حداقل یک عکس از خود خانه بگذار.');
  if(postPhotos.some(p => p.state === 'checking')) return showErr('چند لحظه صبر کن، عکس‌ها در حال بررسی‌اند.');
  const type = gv('type');
  const title = v('fTitle');
  if(title.length < 5) return showErr('عنوان را بنویس (حداقل ۵ حرف).');
  if(title.length > 25) return showErr('عنوان حداکثر ۲۵ حرف باشد.');
  if(BAD_TITLE.test(title)) return showErr('فقط آگهی خانه قبول می‌شود. عنوان را درست کن.');
  const address = v('fAddr');
  if(address.length < 3) return showErr('آدرس را بنویس.');
  let phone = toLatin(v('fPhone')).replace(/\D/g,'');
  if(/^7\d{8}$/.test(phone)) phone = '0' + phone;
  if(!/^07\d{8}$/.test(phone)) return showErr('شماره تماس درست نیست. بعد از +93 نُه رقم بنویس، مثل ۷۹۱۲۳۴۵۶۷.');
  if(!$('fOwner').checked) return showErr('باید تأیید کنی که خانه مال خودت است یا صاحب‌خانه اجازه داده.');
  const btn = $('fSubmit'); btn.disabled = true; btn.textContent = 'در حال فرستادن...';
  const up = [];
  try{
    const s = await getSess();
    if(!s.acct){ openAuth('/post'); throw {code:'account_required'}; }
    for(let i = 0; i < postPhotos.length; i++){
      btn.textContent = 'عکس ' + fa(i+1) + ' از ' + fa(postPhotos.length) + '...';
      const blob = await (await fetch(postPhotos[i].url)).blob();
      const name = s.uid + '/' + Date.now().toString(36) + '-' + i + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
      await raw('/storage/v1/object/ad-photos/' + name, {method:'POST', body:blob, token:s.at, headers:{'Content-Type':'image/jpeg', 'x-upsert':'false'}, timeout:60000});
      up.push(name);
    }
    btn.textContent = 'ثبت آگهی...';
    await rpc('create_ad', {p_kind:type, p_title:title, p_address:address, p_rooms:+gv('rooms'), p_floor:gv('floor'), p_water:gv('water'), p_power:gv('power'),
      p_amount:0, p_price_text:NO_PRICE, p_note:v('fNote'), p_extras:readExtras(type), p_photos:up.map(n => SB + '/storage/v1/object/public/ad-photos/' + n), p_phone:phone});
    showSent(); loadAds();
  }catch(e){
    delPhotos(up);
    showErr(errMsg(e)); btn.disabled = false; btn.textContent = 'ثبت آگهی';
  }
}

let mineList = null, mineId = '', mineQuota = null, mineGone = [];
async function loadMine(){
  const s = await getSess();
  const rows = await raw('/rest/v1/ads?select=' + COLS + ',reject_reason&owner=eq.' + s.uid + '&order=created_at.desc', {token:s.at});
  mineList = rows.map(mapRow);
  // آگهی‌هایی که خودشان از سایت برداشته شده‌اند (مدتشان تمام شده بود) به کاربر گفته می‌شود
  try{
    const k = 'seen_' + s.uid, g = 'gone_' + s.uid;
    const seen = JSON.parse(localStorage.getItem(k) || '{}'), now = {};
    mineList.forEach(a => { now[a.id] = a.title; });
    const gone = JSON.parse(localStorage.getItem(g) || '[]');
    Object.keys(seen).forEach(id => { if(!(id in now)) gone.push(seen[id]); });
    localStorage.setItem(k, JSON.stringify(now)); localStorage.setItem(g, JSON.stringify(gone.slice(-5))); mineGone = gone.slice(-5);
  }catch(e){}
}
function leftText(ms){ if(ms <= 0) return ''; const h = Math.floor(ms / 3600000), d = Math.floor(h / 24), hh = h % 24; return d ? fa(d) + ' روز و ' + fa(hh) + ' ساعت' : fa(Math.max(1, hh)) + ' ساعت'; }
function mineState(a){
  const left = new Date(a.expires).getTime() - Date.now();
  if(a.status === 'pending') return ['w', 'در انتظار بررسی', 'در انتظار بررسی'];
  if(a.status === 'rejected') return ['r', 'رد شد', 'رد شد'];
  if(a.status === 'rented'){ const l = 12 * 3600000 - (Date.now() - new Date(a.rentedAt || Date.now()).getTime()); return ['g', (STAMP[a.type] || 'تمام شد') + (l > 0 ? '؛ ' + leftText(l) + ' دیگر در سایت می‌ماند و بعد پاک می‌شود' : '؛ به‌زودی پاک می‌شود'), STAMP[a.type] || 'تمام شد']; }
  if(left <= 0) return ['r', 'مدت نمایش تمام شد و از سایت برداشته شد. برای نمایش دوباره تمدید کن، وگرنه چند روز بعد پاک می‌شود.', 'منقضی شد'];
  return ['g', 'در سایت دیده می‌شود؛ ' + leftText(left) + ' مانده', 'فعال · ' + leftText(left).split(' و ')[0] + ' مانده'];
}

function route(scrollTo, animate){
  if((NEEDS_LOGIN.test(cur) && !isUser()) || (cur==='/admin' && !isAdmin)) cur = '/';
  const p = cur.split('/'); // ["", "c", "house"]
  const isList = p[1]==='c';
  $('app').innerHTML = isList ? list(p[2]) : p[1]==='h' ? detail(p[2]) : p[1]==='f' ? favPage() : p[1]==='post' ? postPage() : p[1]==='rules' ? rulesPage() : p[1]==='mine' ? minePage(p[2]) : p[1]==='edit' ? editPage(p[2]) : p[1]==='admin' ? adminPage() : p[1]==='report' ? reportPage(p[2]) : p[1]==='me' ? mePage() : home();
  if(p[1]==='post') initPost();
  if(p[1]==='mine') initMine(p[2]);
  if(p[1]==='edit') initEdit(p[2]);
  if(p[1]==='admin') initAdmin();
  if(p[1]==='report') initReport(p[2]);
  if(p[1]==='me') initMe();
  if(p[1]==='h'){ const hh = houses.find(x => x.id === p[2]); if(hh) countView(hh.id); }
  document.body.classList.toggle('adm-on', p[1]==='admin' && isAdmin);
  $('back').hidden = cur==='/';
  $('tabs').hidden = !isList;
  $('sf').hidden = ['h','f','post','rules','mine','edit','admin','report','me'].includes(p[1]);
  refreshHearts();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  const ap = $('app'); ap.classList.remove('anim','slide-next','slide-prev');
  if(animate){ void ap.offsetWidth; ap.classList.add(animate==='next' ? 'slide-next' : animate==='prev' ? 'slide-prev' : 'anim'); }
  window.scrollTo(0, scrollTo||0);
}

const REPORT_REASONS = ['آگهی دروغ یا فریب','عکس یا شماره نادرست','خانه قبلاً داده شده','مزاحمت یا رفتار بد','مشکل دیگر'];
function reportPage(id){
  return `<h1 style="margin-bottom:4px">گزارش</h1>
  <div class="sub">${id ? 'این آگهی را گزارش می‌کنی.' : 'مشکل یا آگهی مشکوک را برای ما بنویس.'} مدیر همهٔ گزارش‌ها را می‌خواند.</div>
  <h2 class="sec2">موضوع</h2><div class="chips" id="rReasons">${REPORT_REASONS.map((r,i) => `<button type="button" data-r="${i}" class="${i ? '' : 'on'}">${r}</button>`).join('')}</div>
  <h2 class="sec2">توضیح (اختیاری)</h2><textarea class="fi" id="rText" maxlength="500" placeholder="مثلاً شمارهٔ آگهی یا چه اتفاقی افتاده"></textarea>
  <div class="err" id="formErr" hidden></div>
  <button type="button" class="call btn" id="rGo">فرستادن گزارش</button>`;
}
function initReport(id){
  let sel = 0;
  $('rReasons').onclick = e => { const b = e.target.closest('button'); if(!b) return; sel = +b.dataset.r; $('rReasons').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('rGo').onclick = async () => {
    showErr(''); $('rGo').disabled = true; $('rGo').textContent = 'لحظه...';
    try{
      await rpc('submit_report', {p_ad:id || null, p_reason:REPORT_REASONS[sel], p_details:$('rText').value.trim()});
      $('app').innerHTML = '<h1>گزارش فرستاده شد ✓</h1><div class="note">ممنون. مدیر آن را بررسی می‌کند.</div><div class="actions" style="margin-top:16px"><a class="call share" href="#" data-go="/">صفحهٔ اول</a></div>';
    }catch(e){ showErr(errMsg(e)); $('rGo').disabled = false; $('rGo').textContent = 'فرستادن گزارش'; }
  };
}

// ================= ورود و ایجاد حساب =================
let authMode = 'login', authNext = '', authTerms = false, authMail = '', resetTok = null;
const siteBase = () => (location.protocol === 'file:' || !location.origin || location.origin === 'null') ? '' : location.origin + location.pathname.replace(/index\.html$/, '');
const redir = () => { const b = siteBase(); return b ? '?redirect_to=' + encodeURIComponent(b) : ''; };
let authStage = 'form', authPend = null, authPoll = null;
function authStop(){ if(authPoll){ clearInterval(authPoll); authPoll = null; } }
function showAuth(mode, info, needResend){ authMode = mode; authStage = 'form'; authStop(); drawAuth(info, needResend); $('auth').hidden = false; document.body.style.overflow = 'hidden'; closeDrawer(); }
function openAuth(next){ authNext = next || ''; showAuth('login'); }
function closeAuth(){ authStop(); authStage = 'form'; authPend = null; $('auth').hidden = true; document.body.style.overflow = ''; }
const fillBrand = () => { const mk = document.querySelector('.logo .mark'); const b = $('aBrand'); if(b && mk) b.appendChild(mk.cloneNode(true)); };
const MAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
async function loginDone(d, mail, home){
  let adm = false;
  try{ adm = (await raw('/rest/v1/rpc/is_admin', {method:'POST', body:{}, token:d.access_token})) === true; }catch(e){}
  saveSess(mkSess(d, adm, true, mail)); mineList = null; adminList = null; adminUsers = null; adminStats = null;
  authStop(); authStage = 'form'; authPend = null;
  const n = authNext; authNext = ''; closeAuth(); loadAds();
  if(home){ hist = []; cur = '/'; route(0); } else if(n) go(n); else route(window.scrollY);
}
function drawAuth(info, needResend){
  if(authStage === 'rules') return drawAuthRules();
  if(authStage === 'wait') return drawAuthWait();
  const m = authMode, su = m === 'signup', fg = m === 'forgot', rs = m === 'reset', lg = m === 'login';
  const tabs = (lg || su) ? `<div class="a-tabs"><button type="button" data-m="login" class="${lg ? 'on' : ''}">ورود</button><button type="button" data-m="signup" class="${su ? 'on' : ''}">ساخت حساب</button></div>` : '';
  const title = fg ? '<h1 class="a-h">بازیابی رمز</h1>' : rs ? '<h1 class="a-h">رمز تازه</h1>' : '';
  const sub = lg ? 'برای ثبت آگهی‌های خود وارد شوید.' : su ? 'برای ثبت آگهی، یک حساب بسازید.'
    : fg ? 'ایمیل حسابتان را بنویسید. اگر حساب داشته باشد، لینک تغییر رمز برایش فرستاده می‌شود.' : 'رمز تازه‌تان را بنویسید.';
  const btn = lg ? 'ورود' : su ? 'ادامه' : fg ? 'فرستادن لینک' : 'ذخیرهٔ رمز و ورود';
  $('auth').innerHTML = `<button type="button" class="a-x" id="aX" aria-label="بستن">×</button>
  <div class="a-in">
    <div class="a-brand" id="aBrand"></div>
    <div class="a-name">Yamora</div>
    <div class="a-fa">یامورا · راهی برای پیدا کردن خانه</div>
    ${tabs}${title}
    <p class="a-p" style="margin-top:14px">${sub}</p>
    <form id="aForm" novalidate>
      ${rs ? `<p class="a-p" style="direction:ltr;text-align:left">${esc(authMail)}</p>` : `<label class="a-l" for="aE">ایمیل</label>
      <input class="a-i" id="aE" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(authMail)}">`}
      ${fg ? '' : `<label class="a-l" for="aP">${rs ? 'رمز تازه' : 'رمز عبور'}</label>
      <div class="a-pw"><input class="a-i" id="aP" type="password" autocomplete="${lg ? 'current-password' : 'new-password'}"><button type="button" class="a-eye" id="aEye" aria-label="نمایش رمز">${EYE}</button></div>
      ${(su || rs) ? '<div class="a-hint">لطفاً حداقل رمز ۸ حرفی وارد کنید و برای بازیابی حسابتان آن را جای امن نگهداری کنید.</div>' : ''}`}
      ${lg ? '<button type="button" class="a-link" id="aForgot" style="padding-right:0">رمز را فراموش کرده‌ام</button>' : ''}
      <div class="a-ok" id="aOk" ${info ? '' : 'hidden'}>${esc(info || '')}</div>
      <div class="a-err" id="aErr" hidden></div>
      <button type="button" class="a-link" id="aResend" ${needResend ? '' : 'hidden'} style="padding-right:0">ارسال دوباره ایمیل تأیید</button>
      <button type="submit" class="a-go" id="aGo">${btn}</button>
      ${(fg || rs) ? '<button type="button" class="a-link" id="aBack" style="padding-right:0">بازگشت به ورود</button>' : ''}
    </form>
  </div>`;
  fillBrand();
  const err = t => { $('aErr').textContent = t; $('aErr').hidden = !t; if(t) $('aOk').hidden = true; };
  const mailNow = () => ($('aE') ? $('aE').value.trim().toLowerCase() : authMail);
  $('aX').onclick = closeAuth;
  document.querySelectorAll('.a-tabs button').forEach(b => { b.onclick = () => { if(b.dataset.m === authMode) return; authMail = mailNow(); showAuth(b.dataset.m); }; });
  if($('aEye')) $('aEye').onclick = () => { const on = $('aP').type === 'password'; $('aP').type = on ? 'text' : 'password'; $('aEye').classList.toggle('on', on); };
  if($('aForgot')) $('aForgot').onclick = () => { authMail = mailNow(); showAuth('forgot'); };
  if($('aBack')) $('aBack').onclick = () => { authMail = mailNow(); showAuth('login'); };
  $('aResend').onclick = async () => {
    const mail = mailNow(); err('');
    if(!MAIL_RE.test(mail)) return err('ایمیل را درست بنویسید.');
    $('aResend').disabled = true;
    try{
      await raw('/auth/v1/resend' + redir(), {method:'POST', body:{type:'signup', email:mail}});
      $('aOk').textContent = 'ایمیل تأیید دوباره فرستاده شد. (پوشهٔ اسپم را هم ببینید)'; $('aOk').hidden = false; $('aErr').hidden = true;
    }catch(e){ err(errMsg(e)); }
    setTimeout(() => { if($('aResend')) $('aResend').disabled = false; }, 30000);
  };
  $('aForm').onsubmit = async ev => {
    ev.preventDefault(); err('');
    const mail = mailNow(); authMail = mail;
    if(!rs && !MAIL_RE.test(mail)) return err('ایمیل را درست بنویسید.');
    const btnEl = $('aGo'), label = btnEl.textContent;
    if(fg){
      btnEl.disabled = true; btnEl.textContent = 'لحظه...';
      try{
        await raw('/auth/v1/recover' + redir(), {method:'POST', body:{email:mail}});
        $('aOk').textContent = 'اگر این ایمیل حساب دارد، لینک تغییر رمز فرستاده شد. (پوشهٔ اسپم را هم ببینید)'; $('aOk').hidden = false;
      }catch(e){ err(errMsg(e)); }
      setTimeout(() => { if($('aGo')){ $('aGo').disabled = false; $('aGo').textContent = label; } }, 30000);
      return;
    }
    const pass = $('aP').value;
    if(!pass) return err('رمز عبور را بنویسید.');
    if((su || rs) && pass.length < 8) return err('رمز باید حداقل ۸ حرف باشد.');
    if(su){ authPend = {mail, pass}; authStage = 'rules'; drawAuth(); return; }
    btnEl.disabled = true; btnEl.textContent = 'لحظه...';
    try{
      let d;
      if(rs){
        await raw('/auth/v1/user', {method:'PUT', body:{password:pass}, token:resetTok.at});
        d = {access_token:resetTok.at, refresh_token:resetTok.rt, expires_at:resetTok.exp, user:{id:resetTok.uid}};
        resetTok = null; toast('رمز تازه ذخیره شد ✓');
      } else d = await raw('/auth/v1/token?grant_type=password', {method:'POST', body:{email:mail, password:pass}});
      await loginDone(d, mail, false);
    }catch(e){
      err(errMsg(e)); btnEl.disabled = false; btnEl.textContent = label;
      if(/not.?confirmed/i.test(String((e && e.code) || ''))) $('aResend').hidden = false;
    }
  };
}
function drawAuthRules(){
  authStop();
  $('auth').innerHTML = `<button type="button" class="a-x" id="aX" aria-label="بستن">×</button>
  <div class="a-rules">
    <div class="a-brand" id="aBrand"></div><div class="a-name">Yamora</div>
    <h1>قوانین یامورا</h1>
    <div class="rules">${rulesHtml()}</div>
    <label class="a-c"><input type="checkbox" id="aT"><span>من قوانین یامورا را خوانده‌ام و با آن موافقت می‌کنم.</span></label>
    <div class="a-warn" id="aW"></div>
    <div class="a-err" id="aErr" hidden></div>
    <button type="button" class="a-go dim" id="aGo">ایجاد حساب</button>
    <button type="button" class="a-link" id="aBk" style="padding-right:0">بازگشت</button>
  </div>`;
  fillBrand();
  $('aX').onclick = closeAuth;
  $('aBk').onclick = () => { authStage = 'form'; authMode = 'signup'; authMail = authPend ? authPend.mail : ''; drawAuth(); };
  $('aT').onchange = () => { $('aGo').classList.toggle('dim', !$('aT').checked); if($('aT').checked) $('aW').textContent = ''; };
  $('aGo').onclick = async () => {
    if(!$('aT').checked){ $('aW').textContent = 'برای ساختن حساب لطفاً قوانین را خوانده و با آن موافقت کنید.'; return; }
    const {mail, pass} = authPend, b = $('aGo'); b.disabled = true; b.textContent = 'لحظه...';
    try{
      const d = await raw('/auth/v1/signup' + redir(), {method:'POST', body:{email:mail, password:pass, data:{terms_accepted:true, terms_at:new Date().toISOString()}}});
      if(d && d.access_token){ await loginDone(d, mail, true); return; }
      authStage = 'wait'; drawAuth();
    }catch(e){ $('aErr').textContent = errMsg(e); $('aErr').hidden = false; b.disabled = false; b.textContent = 'ایجاد حساب'; }
  };
}
function drawAuthWait(){
  const {mail, pass} = authPend;
  $('auth').innerHTML = `<button type="button" class="a-x" id="aX" aria-label="بستن">×</button>
  <div class="a-wait">
    <div class="a-brand" id="aBrand"></div><div class="a-name">Yamora</div>
    <div class="a-spin" role="status" aria-label="در انتظار تأیید"></div>
    <div class="a-wt">پوشهٔ اسپم ایمیل خود را ببینید و حساب را تأیید کنید. کد ایمیل را اینجا بنویسید، یا روی لینک داخل ایمیل بزنید.</div>
    <div class="a-ws">${esc(mail)}</div>
    <div class="a-code"><input id="aCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="کد" aria-label="کد تأیید"><button type="button" id="aCodeGo">تأیید</button></div>
    <div class="a-ok" id="aOk" hidden style="margin-top:16px"></div>
    <div class="a-wb"><button type="button" class="a-link" id="aResend" style="padding:6px 0">ارسال دوباره ایمیل</button>
    <button type="button" class="a-link" id="aBk" style="padding:6px 0">ایمیل را اشتباه نوشتم یا قبلاً حساب دارم</button></div>
  </div>`;
  fillBrand();
  $('aX').onclick = closeAuth;
  $('aCodeGo').onclick = async () => {
    const c = toLatin($('aCode').value).replace(/\D/g, '');
    if(c.length < 6 || c.length > 10){ $('aOk').textContent = 'کد ایمیل را کامل بنویسید.'; $('aOk').hidden = false; return; }
    const b = $('aCodeGo'); b.disabled = true;
    try{
      const d = await raw('/auth/v1/verify', {method:'POST', body:{type:'signup', email:mail, token:c}});
      if(d && d.access_token){ authStop(); toast('ایمیلت تأیید شد ✓'); await loginDone(d, mail, true); return; }
      throw {code:'Token has expired'};
    }catch(e){ $('aOk').textContent = errMsg(e); $('aOk').hidden = false; b.disabled = false; }
  };
  $('aBk').onclick = () => { authStop(); authStage = 'form'; authMode = 'login'; authMail = mail; drawAuth(); };
  $('aResend').onclick = async () => {
    $('aResend').disabled = true;
    try{ await raw('/auth/v1/resend' + redir(), {method:'POST', body:{type:'signup', email:mail}}); $('aOk').textContent = 'ایمیل دوباره فرستاده شد.'; $('aOk').hidden = false; }
    catch(e){ $('aOk').textContent = errMsg(e); $('aOk').hidden = false; }
    setTimeout(() => { if($('aResend')) $('aResend').disabled = false; }, 30000);
  };
  // اگر لینک ایمیل در جای دیگری باز شد، همین‌جا هم خودکار وارد می‌شویم
  authStop(); let n = 0;
  authPoll = setInterval(async () => {
    if(++n > 100 || $('auth').hidden || authStage !== 'wait'){ authStop(); return; }
    try{
      const d = await raw('/auth/v1/token?grant_type=password', {method:'POST', body:{email:mail, password:pass}});
      if(d && d.access_token){ authStop(); toast('ایمیلت تأیید شد ✓'); await loginDone(d, mail, true); }
    }catch(e){}
  }, 6000);
}
// لینک‌های ایمیل (تأیید ثبت‌نام، بازیابی رمز) با اطلاعات در آدرس به سایت برمی‌گردند
async function handleAuthHash(){
  const h = location.hash.replace(/^#/, ''); if(!h || h.indexOf('=') < 0) return;
  const p = new URLSearchParams(h);
  const clean = () => { try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} };
  if(p.get('error')){
    clean(); authMail = ''; showAuth('login', 'این لینک قدیمی شده یا قبلاً استفاده شده. ایمیلت را بنویس و «ارسال دوباره ایمیل تأیید» را بزن، یا اگر تأیید شده، وارد شو.', true); return;
  }
  const at = p.get('access_token'); if(!at) return;
  const type = p.get('type'); clean();
  try{
    const u = await raw('/auth/v1/user', {token:at});
    const mail = String(u.email || '').toLowerCase();
    const sx = {at:at, rt:p.get('refresh_token') || '', exp:Math.floor(Date.now()/1000) + (+p.get('expires_in') || 3600), uid:u.id, admin:false, acct:true, mail:mail};
    if(type === 'recovery'){ resetTok = sx; authMail = mail; authNext = ''; showAuth('reset'); return; }
    try{ sx.admin = (await raw('/rest/v1/rpc/is_admin', {method:'POST', body:{}, token:at})) === true; }catch(e){}
    saveSess(sx); toast('ایمیلت تأیید شد ✓ وارد شدی.'); authStop(); authStage = 'form'; authPend = null; closeAuth(); hist = []; cur = '/'; route(0); loadAds();
  }catch(e){ toast(errMsg(e)); }
}

// ================= دربارهٔ من =================
function mePage(){ return `<h1 style="margin-bottom:4px">دربارهٔ من</h1><div id="meBox"><div class="empty">در حال بارگیری...</div></div>`; }
async function initMe(){
  const box = $('meBox'); if(!box) return;
  let u, n = 0;
  try{
    const s = await getSess(false); if(!s) throw {code:'JWT'};
    u = await raw('/auth/v1/user', {token:s.at});
    try{ await loadMine(); n = mineList.length; }catch(e){}
  }catch(e){ box.innerHTML = '<div class="empty">' + esc(errMsg(e)) + '</div>'; return; }
  box.innerHTML = `<div class="me-row"><span>ایمیل</span><b>${esc(u.email || sess.mail || '')}</b></div>
  <div class="me-row"><span>تاریخ ثبت‌نام</span><b>${esc(String(u.created_at || '').slice(0, 10))}</b></div>
  <div class="me-row"><span>تعداد آگهی‌ها</span><b>${n}</b></div>
  <button type="button" class="me-btn" id="meOut">خروج از حساب</button>
  ${isAdmin ? '' : `<button type="button" class="me-btn red" id="meDelOpen">حذف حساب</button>
  <div class="me-del" id="meDel" hidden>با حذف حساب، همهٔ آگهی‌ها، عکس‌ها، ایمیل و رمز شما برای همیشه از سرور پاک می‌شود و برگشتی ندارد.
    <label class="check" style="margin-top:8px"><input type="checkbox" id="meSure"><span>مطمئنم؛ حسابم پاک شود.</span></label>
    <button type="button" class="go" id="meDelGo" disabled>حذف همیشگی حساب</button></div>`}`;
  $('meOut').onclick = () => { saveSess(null); mineList = null; adminList = null; closeDrawer(); hist = []; cur = '/'; route(0); loadAds(); toast('از حساب خارج شدید.'); };
  if($('meDelOpen')){
    $('meDelOpen').onclick = () => { $('meDel').hidden = !$('meDel').hidden; };
    $('meSure').onchange = () => { $('meDelGo').disabled = !$('meSure').checked; };
    $('meDelGo').onclick = async () => {
      const b = $('meDelGo'); b.disabled = true; b.textContent = 'در حال پاک کردن...';
      try{
        await delPhotos((mineList || []).flatMap(a => a.photos.map(photoName)));
        await rpc('delete_my_account');
        saveSess(null); mineList = null; adminList = null; hist = []; cur = '/'; route(0); loadAds();
        toast('حساب و همهٔ اطلاعاتتان پاک شد.');
      }catch(e){ toast(errMsg(e)); b.disabled = false; b.textContent = 'حذف همیشگی حساب'; }
    };
  }
}

try{ if(!sessionStorage.getItem('sv')){ sessionStorage.setItem('sv', '1'); raw('/rest/v1/rpc/count_site_view', {method:'POST', body:{}}).catch(() => {}); } }catch(e){}
route(0);
handleAuthHash();
loadAds().then(() => { if(!/^\/(post|mine|edit|admin|rules|report)/.test(cur)) route(window.scrollY); });
